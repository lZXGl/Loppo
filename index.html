<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loppo - Modern Social Community & Discussion Platform</title>
    <meta name="description" content="Join Loppo, the modern social discussion platform to discover trending topics, share insights, connect with creators, and engage in real-time community discussions.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Loppo - Modern Social Community & Discussion Platform">
    <meta property="og:description" content="Join Loppo to discover trending topics, share insights, connect with creators, and participate in real-time community discussions.">
    <meta property="og:url" content="https://loppo.com/">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Loppo Social Discussion Platform Preview">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Loppo - Modern Social Community & Discussion Platform">
    <meta name="twitter:description" content="Discover trending topics, share ideas, and engage in thoughtful community discussions on Loppo.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD Structured Data: WebSite & LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://loppo.com/#website",
          "url": "https://loppo.com/",
          "name": "Loppo",
          "description": "Modern Community & Social Discussion Platform",
          "publisher": {
            "@id": "https://loppo.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://loppo.com/explore?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "LocalBusiness",
          "@id": "https://loppo.com/#organization",
          "name": "Loppo Inc.",
          "url": "https://loppo.com",
          "logo": "https://loppo.com/assets/default-avatar.png",
          "image": "https://loppo.com/assets/og-image.png",
          "telephone": "+1-800-555-0199",
          "email": "support@loppo.com",
          "priceRange": "$$",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "100 Community Plaza, Suite 400",
            "addressLocality": "San Francisco",
            "addressRegion": "CA",
            "postalCode": "94105",
            "addressCountry": "US"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 37.7749,
            "longitude": -122.4194
          },
          "openingHoursSpecification": {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "18:00"
          },
          "sameAs": [
            "https://twitter.com/loppocommunity",
            "https://discord.gg/loppo"
          ]
        }
      ]
    }
    </script>
    
    <!-- Core Design System & Component Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/home.css">
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- ======================================================================
         1. App Header & Global Navigation
         ====================================================================== -->
    <loppo-header></loppo-header>

    <!-- ======================================================================
         2. Main App 3-Column Layout
         ====================================================================== -->
    <div class="app-layout-container">
        
        <!-- LEFT SIDEBAR: Navigation Menu -->
        <loppo-sidebar></loppo-sidebar>

        <!-- CENTER: Main Discussion Feed -->
        <main class="loppo-feed-main" id="mainFeed" role="main">
            <h1 class="feed-main-heading visually-hidden">Loppo Community Discussions & Stories</h1>
            
            <!-- Feed Filter & Sorting Tabs (New Feature) -->
            <nav class="feed-filter-bar" aria-label="Feed Filters">
                <div class="filter-tabs-group" role="tablist">
                    <button type="button" class="feed-sort-tab active" data-sort="hot" role="tab" aria-selected="true" id="tabSortHot">
                        🔥 <span id="t-tabHot">Hot</span>
                    </button>
                    <button type="button" class="feed-sort-tab" data-sort="latest" role="tab" aria-selected="false" id="tabSortLatest">
                        ⏱️ <span id="t-tabLatest">Latest</span>
                    </button>
                    <button type="button" class="feed-sort-tab" data-sort="top" role="tab" aria-selected="false" id="tabSortTop">
                        🏆 <span id="t-tabTop">Top Liked</span>
                    </button>
                    <button type="button" class="feed-sort-tab" data-sort="media" role="tab" aria-selected="false" id="tabSortMedia">
                        🖼️ <span id="t-tabMedia">Media</span>
                    </button>
                    <button type="button" class="feed-sort-tab" data-sort="saved" role="tab" aria-selected="false" id="tabSortSaved">
                        🔖 <span id="t-tabSaved">Saved</span>
                    </button>
                </div>
                <div class="feed-stats-badge" id="feedCountBadge">Loading...</div>
            </nav>

            <!-- Interactive Post Composer Card -->
            <loppo-post-modal></loppo-post-modal>

            <!-- Dynamic Feed Posts List with Instant Skeleton Loading -->
            <div class="feed-posts-container" id="feedContainer" role="feed" aria-live="polite">
                <div class="skeleton-feed" id="skeletonFeed" aria-label="Loading posts...">
                    <div class="skeleton-card">
                        <div class="skeleton-header-row">
                            <div class="skeleton-avatar skeleton-shimmer"></div>
                            <div class="skeleton-meta-col">
                                <div class="skeleton-title-bar skeleton-shimmer"></div>
                                <div class="skeleton-sub-bar skeleton-shimmer"></div>
                            </div>
                        </div>
                        <div class="skeleton-body-lines">
                            <div class="skeleton-line skeleton-shimmer" style="width: 95%;"></div>
                            <div class="skeleton-line skeleton-shimmer" style="width: 80%;"></div>
                        </div>
                        <div class="skeleton-media-block skeleton-shimmer"></div>
                    </div>
                    <div class="skeleton-card">
                        <div class="skeleton-header-row">
                            <div class="skeleton-avatar skeleton-shimmer"></div>
                            <div class="skeleton-meta-col">
                                <div class="skeleton-title-bar skeleton-shimmer" style="width: 45%;"></div>
                                <div class="skeleton-sub-bar skeleton-shimmer"></div>
                            </div>
                        </div>
                        <div class="skeleton-body-lines">
                            <div class="skeleton-line skeleton-shimmer" style="width: 90%;"></div>
                            <div class="skeleton-line skeleton-shimmer" style="width: 70%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR: Community Stats & Trending Widgets -->
        <loppo-right-rail></loppo-right-rail>

    </div>

    <!-- Mobile Bottom App Bar -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Bottom Navigation">
        <a href="index.html" class="mobile-nav-item active">
            <span class="mobile-nav-icon">🏠</span>
            <span id="t-mbHome">Home</span>
        </a>
        <a href="explore.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🧭</span>
            <span id="t-mbExplore">Explore</span>
        </a>
        <button type="button" class="mobile-nav-create" id="mobileQuickPostBtn" aria-label="Create new post">
            +
        </button>
        <a href="notifications.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🔔</span>
            <span id="t-mbNotif">Alerts</span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">👤</span>
            <span id="t-mbProfile">Profile</span>
        </a>
    </nav>

    <!-- Modal for High-Resolution Full-Screen Images -->
    <div id="imageModal" class="image-modal" role="dialog" aria-modal="true" aria-label="Full Image Viewer">
        <button type="button" class="close-modal-btn" id="btnCloseModal" aria-label="Close image">&times;</button>
        <img class="modal-image" id="modalImage" src="" alt="Enlarged media view">
    </div>

    <!-- Toast Notification Container -->
    

    <!-- JavaScript Scripts -->
    <script src="js/shared.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
