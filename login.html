<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Loppo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- Unified Header -->
    <header class="loppo-header" role="banner">
        <div class="header-container">
            <a href="index.html" class="brand-logo" aria-label="Loppo Home">
                <div class="brand-icon">L</div>
                <h1 class="brand-title">Loppo</h1>
            </a>

            <div class="header-actions">
                <button type="button" class="btn-icon-nav" id="themeToggleBtn" aria-label="Toggle Theme">
                    <span id="themeIcon">🌓</span>
                </button>
                <button type="button" class="btn-pill btn-pill-outline" id="langToggleBtn" aria-label="Change Language">
                    🌐 <span id="langBtnText">العربية</span>
                </button>
            </div>
        </div>
    </header>

    <main class="login-container" role="main">
        <div class="login-header">
            <h1 id="loginTitle">Welcome Back</h1>
            <p id="loginSubtitle">Log in to your account and join the community</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label id="usernameLabel" for="username">Username or Email</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username or email" autocomplete="username">
            </div>

            <div class="input-group">
                <label id="passwordLabel" for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
            </div>

            <div class="input-group remember-row">
                <label class="remember-label" for="rememberMe">
                    <input type="checkbox" id="rememberMe"> <span id="rememberMeText">Remember Me</span>
                </label>
            </div>

            <button type="submit" class="btn-pill btn-pill-primary login-btn" id="loginSubmitBtn">Log In</button>
        </form>

        <div class="divider">
            <span id="orText">OR</span>
        </div>

        <button type="button" onclick="location.href='/auth/google'" class="google-login-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
            <span id="googleLoginText">Continue with Google</span>
        </button>

        <div class="signup-link">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </main>

    <div class="loppo-toast-container" id="toastContainer" aria-live="polite"></div>

    <script src="js/shared.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
