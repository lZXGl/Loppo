<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In to Your Account - Loppo</title>
    <meta name="description" content="Sign in to your Loppo account to participate in conversations, share updates, and follow top creators.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/login">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Sign In to Your Account - Loppo">
    <meta property="og:description" content="Sign in to your Loppo account to participate in discussions and follow top creators.">
    <meta property="og:url" content="https://loppo.com/login">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sign In to Your Account - Loppo">
    <meta name="twitter:description" content="Sign in to your Loppo account to participate in discussions and follow top creators.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Log In",
          "item": "https://loppo.com/login"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Unified Header -->
    <header class="loppo-header" role="banner">
        <div class="header-container">
            <a href="index.html" class="brand-logo" aria-label="Loppo Home">
                <div class="brand-icon">L</div>
                <span class="brand-title">Loppo</span>
            </a>

            <div class="header-actions">
                <button type="button" class="btn-icon-nav" id="themeToggleBtn" aria-label="Toggle Theme">
                    <span id="themeIcon">🌓</span>
                </button>
                <button type="button" class="btn-pill btn-pill-outline" id="langToggleBtn" aria-label="Change Language">
                    🌐 <span id="langBtnText">العربية</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumbs -->
    <nav class="loppo-breadcrumbs" aria-label="Breadcrumb" style="max-width:440px;margin:24px auto 0;">
        <ol class="breadcrumb-list">
            <li><a href="index.html">Home</a></li>
            <li aria-current="page">Log In</li>
        </ol>
    </nav>

    <main class="login-container" role="main">
        <div class="login-header">
            <h1 id="loginTitle" class="page-main-heading">Welcome Back</h1>
            <p id="loginSubtitle">Log in to your account and join the community</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label id="usernameLabel" for="username">Username or Email</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username or email" autocomplete="username">
            </div>

            <div class="input-group">
                <label id="passwordLabel" for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
            </div>

            <div class="input-group remember-row">
                <label class="remember-label" for="rememberMe">
                    <input type="checkbox" id="rememberMe"> <span id="rememberMeText">Remember Me</span>
                </label>
            </div>

            <button type="submit" class="btn-pill btn-pill-primary login-btn" id="loginSubmitBtn">Log In</button>
        </form>

        <div class="divider">
            <span id="orText">OR</span>
        </div>

        <button type="button" onclick="location.href='/auth/google'" class="google-login-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
            <span id="googleLoginText">Continue with Google</span>
        </button>

        <div class="signup-link">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </main>

    

    <script src="js/shared.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
