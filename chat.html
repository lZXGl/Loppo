<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Messages & Community Chat - Loppo</title>
    <meta name="description" content="Connect and chat directly in real-time with creators and community members on Loppo.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/chat">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Direct Messages & Community Chat - Loppo">
    <meta property="og:description" content="Connect and chat directly in real-time with creators and community members on Loppo.">
    <meta property="og:url" content="https://loppo.com/chat">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Direct Messages & Community Chat - Loppo">
    <meta name="twitter:description" content="Connect and chat directly in real-time with creators and community members on Loppo.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Chat",
          "item": "https://loppo.com/chat"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <style>
        .chat-layout-box {
            display: flex;
            height: calc(100vh - var(--header-height) - 48px);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            width: 100%;
        }
        .chat-users-panel {
            width: 280px;
            border-right: 1px solid var(--border-subtle);
            overflow-y: auto;
            background: var(--bg-surface-alt);
        }
        [dir="rtl"] .chat-users-panel {
            border-right: none;
            border-left: 1px solid var(--border-subtle);
        }
        .chat-main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-surface);
        }
        .chat-conversation-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-subtle);
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-messages-scroll {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }
        .message-bubble.sent {
            align-self: flex-end;
            background: var(--accent-color);
            color: white;
            border-bottom-right-radius: 4px;
        }
        [dir="rtl"] .message-bubble.sent {
            border-bottom-right-radius: var(--radius-lg);
            border-bottom-left-radius: 4px;
        }
        .message-bubble.received {
            align-self: flex-start;
            background: var(--bg-surface-alt);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-subtle);
        }
        [dir="rtl"] .message-bubble.received {
            border-bottom-left-radius: var(--radius-lg);
            border-bottom-right-radius: 4px;
        }
        .chat-input-bar {
            padding: 14px 18px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: 10px;
            background: var(--bg-surface);
        }
        .chat-contact-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-subtle);
            transition: background var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-contact-item img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }
        .chat-contact-item:hover, .chat-contact-item.active {
            background: var(--bg-surface-hover);
        }
        @media (max-width: 768px) {
            .chat-users-panel {
                width: 100px;
            }
            .chat-contact-item span {
                display: none;
            }
        }
    </style>
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Unified Header -->
    <loppo-header></loppo-header>

    <div class="app-layout-container" style="max-width:1440px;">
        <!-- LEFT SIDEBAR -->
        <loppo-sidebar></loppo-sidebar>

        <!-- CENTER MAIN: Chat Box -->
        <main class="loppo-feed-main" style="max-width:none;flex:1;" role="main">
            <!-- Breadcrumbs -->
            <nav class="loppo-breadcrumbs" aria-label="Breadcrumb" style="margin-bottom:12px;">
                <ol class="breadcrumb-list">
                    <li><a href="index.html">Home</a></li>
                    <li aria-current="page">Chat</li>
                </ol>
            </nav>
            <h1 class="page-main-heading visually-hidden">Direct Messages & Community Chat</h1>

            <div class="chat-layout-box">
                <div class="chat-users-panel" id="userList">
                    <div style="padding:20px;color:var(--text-muted);font-size:0.9rem;">Loading contacts...</div>
                </div>
                <div class="chat-main-panel">
                    <div class="chat-conversation-header" id="activeChatUser">💬 Select a user to start direct messaging</div>
                    <div class="chat-messages-scroll" id="messageContainer"></div>
                    <div class="chat-input-bar">
                        <input type="text" id="messageInput" placeholder="Type your message..." style="flex:1;padding:10px 16px;border-radius:var(--radius-full);border:1px solid var(--border-subtle);background:var(--bg-surface-alt);color:var(--text-primary);outline:none;">
                        <button class="btn-pill btn-pill-primary" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom App Bar -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Bottom Navigation">
        <a href="index.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🏠</span>
            <span id="t-mbHome">Home</span>
        </a>
        <a href="explore.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🧭</span>
            <span id="t-mbExplore">Explore</span>
        </a>
        <a href="notifications.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🔔</span>
            <span id="t-mbNotif">Alerts</span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">👤</span>
            <span id="t-mbProfile">Profile</span>
        </a>
    </nav>

    

    <script src="js/shared.js"></script>
    <script>
        let activeReceiverId = null;
        let currentUser = null;

        async function initChat() {
            try {
                const userRes = await fetch('/api/user');
                if (!userRes.ok) { window.location.href = 'login.html'; return; }
                currentUser = await userRes.json();
                
                const usersRes = await fetch('/api/users');
                const users = await usersRes.json();
                
                const list = document.getElementById('userList');
                const otherUsers = users.filter(u => u.id !== currentUser.id);
                if (otherUsers.length === 0) {
                    list.innerHTML = '<p style="padding:20px;color:var(--text-muted);font-size:0.85rem;">No other members to chat with yet.</p>';
                    return;
                }

                list.innerHTML = otherUsers.map(u => `
                    <div class="chat-contact-item" onclick="selectUser(${u.id}, '${escapeHtml(u.displayName || u.username)}')">
                        <img src="${u.avatar || '/assets/default-avatar.svg'}" alt="Contact avatar for ${escapeHtml(u.displayName || u.username)}">
                        <span style="font-weight:600;font-size:0.9rem;color:var(--text-primary);">${escapeHtml(u.displayName || u.username)}</span>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Chat init error', e);
            }
        }

        async function selectUser(id, name) {
            activeReceiverId = id;
            document.getElementById('activeChatUser').innerHTML = `💬 Chatting with <span style="color:var(--accent-color);">${name}</span>`;
            document.querySelectorAll('.chat-contact-item').forEach(el => el.classList.remove('active'));
            loadMessages();
        }

        async function loadMessages() {
            if (!activeReceiverId) return;
            try {
                const res = await fetch(`/api/messages/${activeReceiverId}`);
                if (res.ok) {
                    const messages = await res.json();
                    const container = document.getElementById('messageContainer');
                    container.innerHTML = messages.map(m => `
                        <div class="message-bubble ${m.senderId === currentUser.id ? 'sent' : 'received'}">
                            ${escapeHtml(m.text)}
                            <div style="font-size:0.7rem;opacity:0.7;margin-top:4px;">${m.time || ''}</div>
                        </div>
                    `).join('');
                    container.scrollTop = container.scrollHeight;
                }
            } catch (e) {}
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeReceiverId) return;
            
            try {
                await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ receiverId: activeReceiverId, text })
                });
                input.value = '';
                loadMessages();
            } catch (e) {}
        }

        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        setInterval(loadMessages, 3000);
        initChat();
    </script>
</body>
</html>
