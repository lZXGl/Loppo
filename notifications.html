<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity & Notifications - Loppo</title>
    <meta name="description" content="View your interaction alerts, replies, mentions, and upvotes in real-time on Loppo.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/notifications">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Activity & Notifications - Loppo">
    <meta property="og:description" content="View your interaction alerts, replies, mentions, and upvotes on Loppo.">
    <meta property="og:url" content="https://loppo.com/notifications">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Activity & Notifications - Loppo">
    <meta name="twitter:description" content="View your interaction alerts, replies, mentions, and upvotes on Loppo.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Notifications",
          "item": "https://loppo.com/notifications"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/notifications.css">
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Unified Header -->
    <loppo-header></loppo-header>

    <div class="app-layout-container">
        <!-- LEFT SIDEBAR -->
        <loppo-sidebar></loppo-sidebar>

        <!-- CENTER MAIN -->
        <main class="loppo-feed-main" role="main">
            <!-- Breadcrumbs -->
            <nav class="loppo-breadcrumbs" aria-label="Breadcrumb">
                <ol class="breadcrumb-list">
                    <li><a href="index.html">Home</a></li>
                    <li aria-current="page">Notifications</li>
                </ol>
            </nav>

            <div class="notifications-container">
                <div class="notif-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h1 id="notifTitle" class="page-main-heading">🔔 Notifications</h1>
                    <button class="btn-pill btn-pill-primary" id="markAllBtn" onclick="markAllAsRead()">Mark all as read</button>
                </div>

                <div class="notif-list-wrap">
                    <ul class="notif-list" id="notifList" style="list-style:none;display:flex;flex-direction:column;gap:10px;"></ul>
                    <div id="notifEmpty" class="notif-empty" style="display:none;text-align:center;padding:40px;color:var(--text-muted);">
                        <span style="font-size:2.5rem;display:block;margin-bottom:10px;">🔕</span>
                        <h3>No notifications yet</h3>
                        <p>When you get likes, comments, or followers, they will appear here.</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <loppo-right-rail></loppo-right-rail>
    </div>

    <!-- Mobile Bottom App Bar -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Bottom Navigation">
        <a href="index.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🏠</span>
            <span id="t-mbHome">Home</span>
        </a>
        <a href="explore.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🧭</span>
            <span id="t-mbExplore">Explore</span>
        </a>
        <a href="notifications.html" class="mobile-nav-item active">
            <span class="mobile-nav-icon">🔔</span>
            <span id="t-mbNotif">Alerts</span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">👤</span>
            <span id="t-mbProfile">Profile</span>
        </a>
    </nav>

    

    <script src="js/shared.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
