<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication Setup - Loppo</title>
    <meta name="description" content="Secure your Loppo account with Google Authenticator or Authy two-factor authentication (2FA).">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/setup-2fa">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Two-Factor Authentication Setup - Loppo">
    <meta property="og:description" content="Secure your Loppo account with two-factor authentication.">
    <meta property="og:url" content="https://loppo.com/setup-2fa">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Two-Factor Authentication Setup - Loppo">
    <meta name="twitter:description" content="Secure your Loppo account with two-factor authentication.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Settings",
          "item": "https://loppo.com/settings"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "2FA Setup",
          "item": "https://loppo.com/setup-2fa"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <style>
        .setup-container {
            max-width: 500px;
            margin: 20px auto 60px;
            background: var(--bg-surface);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        #qrCode {
            margin: 20px auto;
            padding: 10px;
            background: white;
            display: inline-block;
        }
        .token-input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            text-align: center;
            font-size: 1.5em;
            letter-spacing: 5px;
            background: var(--bg-surface-alt);
            color: var(--text-primary);
        }
    </style>
    <script src="js/theme.js"></script>
    <script src="js/components/loppo-ui.js"></script>
</head>
<body>
    <!-- Breadcrumbs -->
    <nav class="loppo-breadcrumbs" aria-label="Breadcrumb" style="max-width:500px;margin:24px auto 0;">
        <ol class="breadcrumb-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="settings.html">Settings</a></li>
            <li aria-current="page">2FA Setup</li>
        </ol>
    </nav>

    <main class="setup-container" role="main">
        <h1 class="page-main-heading">Enable Two-Factor Authentication</h1>
        <p style="color:var(--text-secondary);font-size:0.95rem;">Scan the QR code with your authenticator app (Google Authenticator, Authy, or 1Password).</p>
        <div id="qrCodeContainer">
            <img id="qrCode" src="" alt="Two-factor authentication QR code for authenticator app enrollment">
        </div>
        <p>Enter the 6-digit code from your app to verify.</p>
        <input type="text" id="token" class="token-input" placeholder="000000" maxlength="6">
        <button class="btn-primary" style="width:100%" onclick="verify2FA()">Verify & Enable</button>
    </div>

    <script src="js/shared.js"></script>
    <script>
        async function loadQR() {
            const res = await fetch('/api/2fa/setup');
            if (res.ok) {
                const data = await res.json();
                document.getElementById('qrCode').src = data.qrCode;
            } else {
                showNotification('Please login first', 'info');
                window.location.href = 'login.html';
            }
        }

        async function verify2FA() {
            const token = document.getElementById('token').value;
            const res = await fetch('/api/2fa/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });

            if (res.ok) {
                showNotification('2FA Enabled Successfully!', 'success');
                window.location.href = 'profile.html';
            } else {
                const data = await res.json();
                showNotification(data.error || 'Verification failed', 'error');
            }
        }

        loadQR();
    </script>
</body>
</html>
