<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech & Developer News - Loppo</title>
    <meta name="description" content="Stay informed with curated tech news, developer updates, AI breakthroughs, and industry insights on Loppo.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/news">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Tech & Developer News - Loppo">
    <meta property="og:description" content="Curated technology, AI, and programming headlines on Loppo.">
    <meta property="og:url" content="https://loppo.com/news">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tech & Developer News - Loppo">
    <meta name="twitter:description" content="Curated technology, AI, and programming headlines on Loppo.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "News",
          "item": "https://loppo.com/news"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/news.css">
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Unified Header -->
    <loppo-header></loppo-header>

    <div class="app-layout-container">
        <!-- LEFT SIDEBAR -->
        <loppo-sidebar></loppo-sidebar>

        <!-- CENTER MAIN -->
        <main class="loppo-feed-main" role="main">
            <!-- Breadcrumbs -->
            <nav class="loppo-breadcrumbs" aria-label="Breadcrumb">
                <ol class="breadcrumb-list">
                    <li><a href="index.html">Home</a></li>
                    <li aria-current="page">News</li>
                </ol>
            </nav>

            <div class="news-header" style="margin-bottom:20px;">
                <h1 class="page-main-heading">📰 Tech & Developer News</h1>
                <p style="color:var(--text-muted);font-size:0.9rem;">Curated technology, AI, and programming headlines</p>
            </div>

            <div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-sm);margin-bottom:20px;">
                <input id="news-search" type="text" placeholder="Search news headlines..." oninput="performNewsSearch()" style="width:100%;padding:10px 16px;background:var(--bg-surface-alt);border:1px solid var(--border-subtle);border-radius:var(--radius-full);outline:none;color:var(--text-primary);">
            </div>
            
            <div id="news-list" style="display:flex;flex-direction:column;gap:16px;"></div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <loppo-right-rail></loppo-right-rail>
    </div>

    <!-- Mobile Bottom App Bar -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Bottom Navigation">
        <a href="index.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🏠</span>
            <span id="t-mbHome">Home</span>
        </a>
        <a href="explore.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🧭</span>
            <span id="t-mbExplore">Explore</span>
        </a>
        <a href="notifications.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🔔</span>
            <span id="t-mbNotif">Alerts</span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">👤</span>
            <span id="t-mbProfile">Profile</span>
        </a>
    </nav>

    

    <script src="js/shared.js"></script>
    <script src="js/news.js"></script>
</body>
</html>
