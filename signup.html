<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Free Account - Loppo</title>
    <meta name="description" content="Join Loppo today to publish posts, share videos, create polls, and engage with vibrant discussions.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/signup">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Create Your Free Account - Loppo">
    <meta property="og:description" content="Join Loppo today to publish posts, share videos, create polls, and engage with vibrant discussions.">
    <meta property="og:url" content="https://loppo.com/signup">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Create Your Free Account - Loppo">
    <meta name="twitter:description" content="Join Loppo today to publish posts, share videos, create polls, and engage with vibrant discussions.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Sign Up",
          "item": "https://loppo.com/signup"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/signup.css">
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Unified Header -->
    <header class="loppo-header" role="banner">
        <div class="header-container">
            <a href="index.html" class="brand-logo" aria-label="Loppo Home">
                <div class="brand-icon">L</div>
                <span class="brand-title">Loppo</span>
            </a>

            <div class="header-actions">
                <button type="button" class="btn-icon-nav" id="themeToggleBtn" aria-label="Toggle Theme">
                    <span id="themeIcon">🌓</span>
                </button>
                <button type="button" class="btn-pill btn-pill-outline" id="langToggleBtn" aria-label="Change Language">
                    🌐 <span id="langBtnText">العربية</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Breadcrumbs -->
    <nav class="loppo-breadcrumbs" aria-label="Breadcrumb" style="max-width:440px;margin:24px auto 0;">
        <ol class="breadcrumb-list">
            <li><a href="index.html">Home</a></li>
            <li aria-current="page">Sign Up</li>
        </ol>
    </nav>

    <main class="signup-container" role="main">
        <div class="signup-header">
            <h1 id="signupTitle" class="page-main-heading">Create Account</h1>
            <p id="signupSubtitle">Join the Loppo community today</p>
        </div>

        <form id="signupForm">
            <div class="input-group">
                <label id="fullNameLabel" for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name" autocomplete="name">
            </div>

            <div class="input-group">
                <label id="usernameLabel" for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Choose a unique username" autocomplete="username">
            </div>

            <div class="input-group">
                <label id="emailLabel" for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email" autocomplete="email">
            </div>

            <div class="input-group">
                <label id="passwordLabel" for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a strong password" autocomplete="new-password">
            </div>

            <div class="input-group">
                <label id="confirmLabel" for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password" autocomplete="new-password">
            </div>

            <button type="submit" class="btn-pill btn-pill-primary signup-btn" id="signupBtn">Create Account</button>
        </form>

        <div class="divider">
            <span id="orText">OR</span>
        </div>

        <div class="login-link">
            <p id="loginText">Already have an account? <a href="login.html">Log In</a></p>
        </div>
    </main>

    

    <script src="js/shared.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
