<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile & Activity - Loppo</title>
    <meta name="description" content="View member profiles, published posts, follower metrics, and account activity on Loppo.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/profile">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Member Profile & Activity - Loppo">
    <meta property="og:description" content="View member profiles, published posts, and account activity on Loppo.">
    <meta property="og:url" content="https://loppo.com/profile">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Member Profile & Activity - Loppo">
    <meta name="twitter:description" content="View member profiles, published posts, and account activity on Loppo.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Profile",
          "item": "https://loppo.com/profile"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/profile.css">
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Unified Header -->
    <loppo-header></loppo-header>

    <div class="app-layout-container">
        <!-- LEFT SIDEBAR -->
        <loppo-sidebar></loppo-sidebar>

        <!-- CENTER MAIN: User Profile -->
        <main class="loppo-feed-main" role="main">
            <!-- Breadcrumbs -->
            <nav class="loppo-breadcrumbs" aria-label="Breadcrumb">
                <ol class="breadcrumb-list">
                    <li><a href="index.html">Home</a></li>
                    <li aria-current="page">Profile</li>
                </ol>
            </nav>

            <div class="profile-container" style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);">
                <div id="coverDisplay" class="profile-banner" style="height:140px;background:linear-gradient(135deg,var(--accent-color) 0%,#38bdf8 100%);position:relative;">
                    <label for="coverUpload" class="edit-cover-label" style="position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.5);color:white;padding:5px 12px;border-radius:var(--radius-full);font-size:0.75rem;cursor:pointer;">📷 Edit Cover</label>
                    <input type="file" id="coverUpload" accept="image/*,image/gif" hidden onchange="uploadCover(event)">
                </div>
                
                <div class="profile-header-info" style="padding:20px;display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;">
                    <div class="avatar" id="avatarDisplay" onclick="document.getElementById('avatarUpload').click()" style="width:84px;height:84px;border-radius:50%;border:4px solid var(--bg-surface);margin-top:-42px;position:relative;cursor:pointer;background:var(--accent-color);overflow:hidden;box-shadow:var(--shadow-md);">
                        <img id="profileAvatar" src="/assets/default-avatar.svg" style="width:100%;height:100%;object-fit:cover;display:block;" alt="Member Profile Picture">
                        <div class="avatar-upload-overlay" style="position:absolute;inset:0;background:rgba(0,0,0,0.4);color:white;display:flex;align-items:center;justify-content:center;font-size:0.75rem;opacity:0;transition:opacity 0.2s;">Change</div>
                    </div>
                    <input type="file" id="avatarUpload" accept="image/*,image/gif" style="display:none;" onchange="uploadAvatar(event)">
                    
                    <div class="user-details" style="flex:1;">
                        <h1 id="displayName" class="page-main-heading">User Profile</h1>
                        <p id="userBio" style="color:var(--text-secondary);font-size:0.9rem;margin-top:4px;">No bio yet.</p>
                        
                        <div class="stat-grid" style="display:flex;gap:20px;margin-top:14px;">
                            <div class="stat-card">
                                <div class="stat-number" id="followersCount" style="font-weight:700;font-size:1.1rem;color:var(--text-primary);">0</div>
                                <div class="stat-label" style="font-size:0.75rem;color:var(--text-muted);">Followers</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number" id="followingCount" style="font-weight:700;font-size:1.1rem;color:var(--text-primary);">0</div>
                                <div class="stat-label" style="font-size:0.75rem;color:var(--text-muted);">Following</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number" id="postsCount" style="font-weight:700;font-size:1.1rem;color:var(--text-primary);">0</div>
                                <div class="stat-label" style="font-size:0.75rem;color:var(--text-muted);">Posts</div>
                            </div>
                        </div>
                    </div>
                    
                    <button class="btn-pill btn-pill-outline" onclick="editBio()">✏️ Edit Bio</button>
                </div>
            </div>

            <div class="profile-tabs" style="display:flex;gap:20px;border-bottom:1px solid var(--border-subtle);padding-bottom:10px;margin-top:10px;">
                <span class="tab active" style="font-weight:700;color:var(--accent-color);cursor:pointer;border-bottom:2px solid var(--accent-color);padding-bottom:8px;">My Posts</span>
            </div>
            
            <div id="userPostsContainer" style="display:flex;flex-direction:column;gap:16px;">
                <!-- User posts rendered by profile.js -->
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <loppo-right-rail></loppo-right-rail>
    </div>

    <!-- Mobile Bottom App Bar -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Bottom Navigation">
        <a href="index.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🏠</span>
            <span id="t-mbHome">Home</span>
        </a>
        <a href="explore.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🧭</span>
            <span id="t-mbExplore">Explore</span>
        </a>
        <a href="notifications.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🔔</span>
            <span id="t-mbNotif">Alerts</span>
        </a>
        <a href="profile.html" class="mobile-nav-item active">
            <span class="mobile-nav-icon">👤</span>
            <span id="t-mbProfile">Profile</span>
        </a>
    </nav>

    

    <script src="js/shared.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
