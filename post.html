<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Discussion Thread - Loppo</title>
    <meta name="description" content="Read full community discussion threads, comments, and member replies on Loppo.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/post">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Community Discussion Thread - Loppo">
    <meta property="og:description" content="Read full community discussion threads, comments, and member replies on Loppo.">
    <meta property="og:url" content="https://loppo.com/post">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Community Discussion Thread - Loppo">
    <meta name="twitter:description" content="Read full community discussion threads, comments, and member replies on Loppo.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Discussions",
          "item": "https://loppo.com/popular"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Post Thread",
          "item": "https://loppo.com/post"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/post.css">
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Unified Header -->
    <loppo-header></loppo-header>

    <div class="app-layout-container">
        <!-- LEFT SIDEBAR -->
        <loppo-sidebar></loppo-sidebar>

        <!-- CENTER MAIN -->
        <main class="loppo-feed-main" role="main">
            <!-- Breadcrumbs -->
            <nav class="loppo-breadcrumbs" aria-label="Breadcrumb">
                <ol class="breadcrumb-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="popular.html">Discussions</a></li>
                    <li aria-current="page">Post Thread</li>
                </ol>
            </nav>

            <div class="post-container" id="postContainer">
                <h1 class="page-main-heading" id="postInitialHeading">Discussion Thread</h1>
                <div style="text-align:center; padding:40px; color:var(--text-muted);">Loading discussion thread...</div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <loppo-right-rail></loppo-right-rail>
    </div>

    <!-- Mobile Bottom App Bar -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Bottom Navigation">
        <a href="index.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🏠</span>
            <span id="t-mbHome">Home</span>
        </a>
        <a href="explore.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🧭</span>
            <span id="t-mbExplore">Explore</span>
        </a>
        <a href="notifications.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🔔</span>
            <span id="t-mbNotif">Alerts</span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">👤</span>
            <span id="t-mbProfile">Profile</span>
        </a>
    </nav>

    <!-- Report Post Modal -->
    <div id="reportPostModal" class="report-modal">
        <h3 id="reportPostTitle">Report Post</h3>
        <p>Why are you reporting this post?</p>
        <textarea id="reportPostReason" class="report-reason" rows="3" placeholder="Describe the issue..."></textarea>
        <div class="report-buttons">
            <button class="btn-pill btn-pill-outline" onclick="closeReportPostModal()">Cancel</button>
            <button class="btn-pill btn-pill-primary" id="submitReportPostBtn">Submit Report</button>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>
    

    <script src="js/shared.js"></script>
    <script src="js/post.js"></script>
</body>
</html>
