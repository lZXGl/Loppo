<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us & Support - Loppo</title>
    <meta name="description" content="Get in touch with the Loppo support team for technical help, bug reports, partnerships, and community feedback.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/contact">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Contact Us & Support - Loppo">
    <meta property="og:description" content="Get in touch with the Loppo support team for technical help, partnerships, and community feedback.">
    <meta property="og:url" content="https://loppo.com/contact">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact Us & Support - Loppo">
    <meta name="twitter:description" content="Get in touch with the Loppo support team for technical help and community feedback.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList & ContactPoint -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://loppo.com/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Contact",
              "item": "https://loppo.com/contact"
            }
          ]
        },
        {
          "@type": "LocalBusiness",
          "name": "Loppo Support",
          "url": "https://loppo.com/contact",
          "telephone": "+1-800-555-0199",
          "email": "support@loppo.com",
          "priceRange": "$$",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "100 Community Plaza",
            "addressLocality": "San Francisco",
            "addressRegion": "CA",
            "postalCode": "94105",
            "addressCountry": "US"
          }
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/contact.css">
    <script src="js/theme.js"></script>
    <script src="js/components/loppo-ui.js"></script>
</head>
<body>

<loppo-header></loppo-header>

<div class="app-layout-container">
        <loppo-sidebar></loppo-sidebar>

    <div class="main-feed">
        <!-- Breadcrumbs -->
        <nav class="loppo-breadcrumbs" aria-label="Breadcrumb">
            <ol class="breadcrumb-list">
                <li><a href="index.html">Home</a></li>
                <li aria-current="page">Contact</li>
            </ol>
        </nav>

        <div class="contact-container">
            <div class="contact-header">
                <h1 id="contactTitle" class="page-main-heading">Contact Us</h1>
                <p id="contactSubtitle">We would love to hear from you. Fill out the form and we will get back to you within 24 hours.</p>
            </div>
            
            <form id="contactForm" onsubmit="submitContact(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label id="nameLabel">Full Name</label>
                        <input type="text" id="fullName" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label id="emailLabel">Email Address</label>
                        <input type="email" id="email" required placeholder="your@email.com">
                    </div>
                </div>
                
                <div class="form-group">
                    <label id="subjectLabel">Subject</label>
                    <select id="subject" required>
                        <option value="" id="selectOption">Select a subject...</option>
                        <option id="optGeneral">General Inquiry</option>
                        <option id="optTech">Technical Support</option>
                        <option id="optBug">Bug Report</option>
                        <option id="optFeature">Feature Request</option>
                        <option id="optPartnership">Partnership</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label id="messageLabel">Message</label>
                    <textarea id="message" rows="5" required placeholder="Please describe your issue or question in detail..."></textarea>
                </div>
                
                <button type="submit" class="btn-primary" id="sendBtn" style="width: 100%; padding: 14px;">Send Message</button>
            </form>
            
            <div class="contact-info">
                <div class="info-card">
                    <div class="emoji">📧</div>
                    <div class="value" id="emailValue">support@Loppo.com</div>
                    <div class="label" id="emailLabelCard">Email</div>
                </div>
                <div class="info-card">
                    <div class="emoji">🐦</div>
                    <div class="value" id="twitterValue">Loppo</div>
                    <div class="label" id="twitterLabel">Twitter</div>
                </div>
                <div class="info-card">
                    <div class="emoji"></div>
                    <div class="value" id="discordValue">Discord.gg/Loppo</div>
                    <div class="label" id="discordLabel">Discord</div>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <h3 id="quickLinksTitle">Quick Links</h3>
        <ul class="sidebar-list">
            <li onclick="location.href='about.html'" id="aboutLink">About Us</li>
            <li onclick="location.href='help.html'" id="helpLink">Help Center</li>
            <li onclick="location.href='rules.html'" id="rulesLink">Community Rules</li>
        </ul>
    </div>
</div>
<script src="js/shared.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
