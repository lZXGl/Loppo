<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections & Friends - Loppo</title>
    <meta name="description" content="Manage your followers, find connections, and see who you are following on Loppo.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/friends">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Connections & Friends - Loppo">
    <meta property="og:description" content="Manage your followers and connections on Loppo.">
    <meta property="og:url" content="https://loppo.com/friends">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Connections & Friends - Loppo">
    <meta name="twitter:description" content="Manage your followers and connections on Loppo.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Connections",
          "item": "https://loppo.com/friends"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/friends.css">
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Unified Header -->
    <loppo-header></loppo-header>

    <div class="app-layout-container">
        <!-- LEFT SIDEBAR -->
        <loppo-sidebar></loppo-sidebar>

        <!-- CENTER MAIN -->
        <main class="loppo-feed-main" role="main">
            <!-- Breadcrumbs -->
            <nav class="loppo-breadcrumbs" aria-label="Breadcrumb">
                <ol class="breadcrumb-list">
                    <li><a href="index.html">Home</a></li>
                    <li aria-current="page">Connections</li>
                </ol>
            </nav>

            <div class="friends-container">
                <div class="friends-header" style="margin-bottom:20px;">
                    <h1 id="friendsTitle" class="page-main-heading">👥 Connections & Friends</h1>
                    <p id="friendsDesc" style="color:var(--text-muted);font-size:0.9rem;">People you follow and who follow your updates</p>
                </div>

                <div class="friends-tabs" style="display:flex;gap:12px;margin-bottom:20px;">
                    <button class="btn-pill btn-pill-primary friend-tab active" onclick="switchTab('following')" id="tabFollowing">Following</button>
                    <button class="btn-pill btn-pill-outline friend-tab" onclick="switchTab('followers')" id="tabFollowers">Followers</button>
                </div>

                <div id="friendsList" style="display:flex;flex-direction:column;gap:12px;"></div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <loppo-right-rail></loppo-right-rail>
    </div>

    <!-- Mobile Bottom App Bar -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Bottom Navigation">
        <a href="index.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🏠</span>
            <span id="t-mbHome">Home</span>
        </a>
        <a href="explore.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🧭</span>
            <span id="t-mbExplore">Explore</span>
        </a>
        <a href="notifications.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🔔</span>
            <span id="t-mbNotif">Alerts</span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">👤</span>
            <span id="t-mbProfile">Profile</span>
        </a>
    </nav>

    

    <script src="js/shared.js"></script>
    <script src="js/friends.js"></script>
</body>
</html>
