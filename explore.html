<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Communities & Creators - Loppo</title>
    <meta name="description" content="Discover trending creators, top communities, and active discussions on Loppo. Connect and expand your network today.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/explore">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Explore Communities & Creators - Loppo">
    <meta property="og:description" content="Discover trending creators, top communities, and active discussions on Loppo.">
    <meta property="og:url" content="https://loppo.com/explore">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Explore Communities & Creators - Loppo">
    <meta name="twitter:description" content="Discover trending creators, top communities, and active discussions on Loppo.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Explore",
          "item": "https://loppo.com/explore"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/explore.css">
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Unified Header -->
    <loppo-header></loppo-header>

    <div class="app-layout-container">
        <!-- LEFT SIDEBAR -->
        <loppo-sidebar></loppo-sidebar>

        <!-- CENTER MAIN: Explore & Discover -->
        <main class="loppo-feed-main" role="main">
            <!-- Breadcrumbs -->
            <nav class="loppo-breadcrumbs" aria-label="Breadcrumb">
                <ol class="breadcrumb-list">
                    <li><a href="index.html">Home</a></li>
                    <li aria-current="page">Explore</li>
                </ol>
            </nav>

            <div class="explore-container">
                <div class="explore-header" style="margin-bottom:24px;">
                    <h1 class="page-main-heading">Discover People & Communities</h1>
                    <p style="color:var(--text-muted);font-size:0.9rem;">Find interesting accounts to follow and expand your network.</p>
                </div>

                <div id="userGrid" style="display:flex;flex-direction:column;gap:12px;">
                    <p style="color:var(--text-muted);font-size:0.9rem;">Loading community members...</p>
                </div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <loppo-right-rail></loppo-right-rail>
    </div>

    <!-- Mobile Bottom App Bar -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Bottom Navigation">
        <a href="index.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🏠</span>
            <span id="t-mbHome">Home</span>
        </a>
        <a href="explore.html" class="mobile-nav-item active">
            <span class="mobile-nav-icon">🧭</span>
            <span id="t-mbExplore">Explore</span>
        </a>
        <a href="notifications.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🔔</span>
            <span id="t-mbNotif">Alerts</span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">👤</span>
            <span id="t-mbProfile">Profile</span>
        </a>
    </nav>

    

    <script src="js/shared.js"></script>
    <script src="js/explore.js"></script>
</body>
</html>
