<!DOCTYPE html>
<html lang="en" id="app-root" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular & Trending Discussions - Loppo</title>
    <meta name="description" content="Discover today's most upvoted discussions, viral community topics, and trending stories on Loppo.">
    
    <!-- Canonical & Favicons -->
    <link rel="canonical" href="https://loppo.com/popular">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Loppo">
    <meta property="og:title" content="Popular & Trending Discussions - Loppo">
    <meta property="og:description" content="Discover today's most upvoted discussions and trending stories on Loppo.">
    <meta property="og:url" content="https://loppo.com/popular">
    <meta property="og:image" content="https://loppo.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Popular & Trending Discussions - Loppo">
    <meta name="twitter:description" content="Discover today's most upvoted discussions and trending stories on Loppo.">
    <meta name="twitter:image" content="https://loppo.com/assets/og-image.png">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://loppo.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Popular",
          "item": "https://loppo.com/popular"
        }
      ]
    }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/popular.css">
    <script src="js/components/loppo-ui.js"></script>
    <script src="js/theme.js"></script>
</head>
<body>

    <!-- Unified Header -->
    <loppo-header></loppo-header>

    <div class="app-layout-container">
        <!-- LEFT SIDEBAR -->
        <loppo-sidebar></loppo-sidebar>

        <!-- CENTER MAIN -->
        <main class="loppo-feed-main" role="main">
            <!-- Breadcrumbs -->
            <nav class="loppo-breadcrumbs" aria-label="Breadcrumb">
                <ol class="breadcrumb-list">
                    <li><a href="index.html">Home</a></li>
                    <li aria-current="page">Popular</li>
                </ol>
            </nav>

            <div class="popular-header" style="margin-bottom:20px;">
                <h1 id="popularTitle" class="page-main-heading">🔥 Popular Discussions</h1>
                <p id="popularDesc" style="color:var(--text-muted);font-size:0.9rem;">Most upvoted and active conversations across the community</p>
            </div>

            <div class="filter-tabs" style="display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;">
                <span class="filter-tab active" data-filter="all" onclick="setFilter('all')" id="filterAll">All Time</span>
                <span class="filter-tab" data-filter="week" onclick="setFilter('week')" id="filterWeek">This Week</span>
                <span class="filter-tab" data-filter="month" onclick="setFilter('month')" id="filterMonth">This Month</span>
                <span class="filter-tab" data-filter="year" onclick="setFilter('year')" id="filterYear">This Year</span>
            </div>

            <div class="sort-buttons" style="display:flex;gap:8px;margin-bottom:20px;">
                <button class="btn-pill btn-pill-primary sort-btn active" data-sort="likes" onclick="setSort('likes')" id="sortLikes">🏆 Most Likes</button>
                <button class="btn-pill btn-pill-outline sort-btn" data-sort="comments" onclick="setSort('comments')" id="sortComments">💬 Most Comments</button>
                <button class="btn-pill btn-pill-outline sort-btn" data-sort="recent" onclick="setSort('recent')" id="sortRecent">⏱️ Most Recent</button>
            </div>

            <div id="feedContainer" style="display:flex;flex-direction:column;gap:16px;"></div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <loppo-right-rail></loppo-right-rail>
    </div>

    <!-- Mobile Bottom App Bar -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Bottom Navigation">
        <a href="index.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🏠</span>
            <span id="t-mbHome">Home</span>
        </a>
        <a href="explore.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🧭</span>
            <span id="t-mbExplore">Explore</span>
        </a>
        <a href="notifications.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">🔔</span>
            <span id="t-mbNotif">Alerts</span>
        </a>
        <a href="profile.html" class="mobile-nav-item">
            <span class="mobile-nav-icon">👤</span>
            <span id="t-mbProfile">Profile</span>
        </a>
    </nav>

    <div id="image-modal" class="image-modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-image" id="modal-image" alt="Enlarged discussion media view">
    </div>

    

    <script src="js/shared.js"></script>
    <script src="js/popular.js"></script>
</body>
</html>
